[tool.poetry]
name = "inride-ai-agent"
version = "0.1.0"
description = "Model gateway for dealer automotive conversations: one chat completion API over frontier and local LLMs"
authors = []
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
pydantic = "^2.9"
python-dotenv = "^1.0.1"
loguru = "^0.7.3"
openai = "^1.55.0"
anthropic = ">=0.70,<1"
google-cloud-secret-manager = "^2.21.0"
asyncpg = ">=0.30,<1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
ollama = ">=0.4.0"
pandas = ">=2.0.0"
matplotlib = ">=3.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
